[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "covtl"
version = "1.2.3"
description = "The COVTL articulatory speech synthesis suite: covtl-synth engine, covtl-console web bridge, covtl-sandhi cross-word rules - one install command"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Frédéric Berthommier"},
]
keywords = [
    "articulatory synthesis",
    "vocal tract",
    "VocalTractLab",
    "speech synthesis",
    "coarticulation",
    "phonation",
    "sandhi",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# Meta-package: pulling these three pins installs the whole local suite
# (engine + web console + sandhi rule package) and their external deps.
# Pins are exact on purpose: the three releases are coherent as a chain;
# bump this file whenever one of them moves.
dependencies = [
    "covtl-synth==1.2.2",
    "covtl-console==3.1.10",
    "covtl-sandhi==0.1.1",
]

[project.urls]
Homepage = "https://github.com/FBerthommier/covtl-pipeline"
Console = "https://github.com/FBerthommier/covtl-console"
Sandhi = "https://github.com/FBerthommier/covtl-sandhi"

[tool.setuptools]
# Meta-package: no code of its own - the distribution only carries its
# metadata and dependency pins.
packages = []
py-modules = []
