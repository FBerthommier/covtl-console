#
# CI for covtl-console: engine-backed test matrix (push/PR, not slow),
# nightly slow lane, standalone bundle artifact, LaTeX manual builds.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"   # nightly — runs the slow lane
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.os }}, py3.12, engine)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the engine (covtl-pipeline)
        run: |
          git clone --depth 1 https://github.com/FBerthommier/covtl-pipeline.git engine
          python -m pip install ./engine
      - name: Install bridge and test dependencies
        run: python -m pip install fastapi uvicorn pytest httpx
      - name: Run the test suite (fast lane)
        run: python -m pytest tests/ -v -m "not slow"

  slow:
    name: slow lane (engine, synthesis + MP4)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the engine (covtl-pipeline)
        run: |
          git clone --depth 1 https://github.com/FBerthommier/covtl-pipeline.git engine
          python -m pip install ./engine
      - name: Install bridge and test dependencies
        run: python -m pip install fastapi uvicorn pytest httpx
      - name: Run the slow lane
        run: python -m pytest tests/ -v -m slow

  standalone:
    name: standalone bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the single-file bundle
        run: python build_standalone.py
      - name: Syntax-check the bundle with node
        run: |
          python - <<'EOF'
          import re, subprocess, tempfile, pathlib
          html = pathlib.Path("covtl-console-standalone.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          assert blocks, "no script blocks found"
          with tempfile.TemporaryDirectory() as td:
              for i, b in enumerate(blocks):
                  p = pathlib.Path(td) / f"b{i}.js"
                  p.write_text(b, encoding="utf-8")
                  r = subprocess.run(["node", "--check", str(p)], capture_output=True, text=True)
                  assert r.returncode == 0, r.stderr[:800]
          print("bundle OK,", len(blocks), "script blocks")
          EOF
      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: covtl-console-standalone
          path: covtl-console-standalone.html

  manuals:
    name: LaTeX manuals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live (base)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended
      - name: Compile the user manual
        run: |
          cd docs/user-manual
          pdflatex -interaction=nonstopmode user-manual.tex
          pdflatex -interaction=nonstopmode user-manual.tex
      - name: Compile the technical manual
        run: |
          cd docs/tech-manual
          pdflatex -interaction=nonstopmode tech-manual.tex
          pdflatex -interaction=nonstopmode tech-manual.tex
      - name: Upload the PDFs
        uses: actions/upload-artifact@v4
        with:
          name: covtl-console-manuals
          path: |
            docs/user-manual/user-manual.pdf
            docs/tech-manual/tech-manual.pdf
