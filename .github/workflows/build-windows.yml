# Workflow GitHub Actions — rebuild du standalone Windows x64.
#
# Miroir de build-linux.yml : installe la chaîne covtl depuis TestPyPI
# (deps réelles depuis PyPI, chaîne épinglée --no-deps — TestPyPI
# héberge un parasite FASTAPI-1.0 qui casse une résolution directe),
# applique le patch idempotent C1, construit le onedir, smoke SUR COPIE
# (B2 : le bundle livré ne contient aucun résidu de test), emballe avec
# porte d'hygiène, puis publie le ZIP en release GitHub
# (windows-standalone, téléchargeable anonymement).
#
# Le launcher gelé embarque le staging %TEMP% (chemins non-ASCII) et la
# garde spawn N2 ; le spec embarque matplotlib (modes vidéo) et le
# patch C1 est un no-op sur les paquets qui l'intègrent déjà.

name: build-windows-x64

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'covtl-console version to install from TestPyPI'
        required: true
        default: '3.1.5'
  push:
    branches: [main]
    paths:
      - 'packaging/windows/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  windows:
    name: Standalone Windows x64 (PyInstaller onedir)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (PyPI) + covtl chain pinned (TestPyPI, --no-deps)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn numpy scipy Pillow imageio-ffmpeg cmudict vocaltractlab-cython matplotlib pyinstaller
          # pins = the current coherent TestPyPI chain; bump these three
          # lines together when publishing the next versions
          python -m pip install --index-url https://test.pypi.org/simple/ --no-deps "covtl-console==${{ inputs.version || '3.1.5' }}" "vtl-synth==1.1.2" "covtl-sandhi==0.1.1"

      - name: pip check
        shell: pwsh
        run: python -m pip check

      - name: Patch C1 (BrokenProcessPool import, idempotent)
        shell: pwsh
        run: python packaging/windows/patch-fix3-brokenprocesspool.py (python -c "import sys; print(sys.prefix)")

      - name: Build PyInstaller onedir
        shell: pwsh
        run: python -m PyInstaller packaging/windows/covtl-console.spec --distpath dist/windows --workpath build/pyinstaller --noconfirm

      - name: Smoke the frozen exe (on a copy, B2)
        shell: pwsh
        run: |
          $env:BROWSER = ''
          Copy-Item -Recurse -Force dist\windows\covtl-console dist\windows\smoke-copy
          python packaging/windows/standalone_smoke.py dist\windows\smoke-copy\covtl-console.exe 2>&1 | Tee-Object -FilePath smoke-run.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content smoke-run.log -Tail 25 | ForEach-Object { Write-Host "::error::$_" }
            throw "smoke failed (rc=$LASTEXITCODE)"
          }
          Remove-Item -Recurse -Force dist\windows\smoke-copy

      - name: Package ZIP (hygiene B2)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging\COVTL-Console-Windows-x64 | Out-Null
          Copy-Item -Recurse -Force dist\windows\covtl-console\* staging\COVTL-Console-Windows-x64\
          if (Test-Path staging\COVTL-Console-Windows-x64\out) {
            Remove-Item -Recurse -Force staging\COVTL-Console-Windows-x64\out
          }
          Compress-Archive -Path staging\COVTL-Console-Windows-x64 -DestinationPath COVTL-Console-Windows-x64.zip -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead("$PWD\COVTL-Console-Windows-x64.zip")
          $bad = @($zip.Entries | Where-Object { $_.FullName -match '(^|\\)(out|temp_video)\\' -or $_.FullName -match '_sm_' })
          $zip.Dispose()
          if ($bad.Count -gt 0) { throw "B2 hygiene gate FAILED: $($bad.Count) residue entries" }
          $sha = (Get-FileHash COVTL-Console-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item COVTL-Console-Windows-x64.zip).Length
          Write-Host "ZIP OK — sha256=$sha size=$size"
          "sha=$sha" | Out-File -Encoding utf8 sha.txt

      - name: Publish the ZIP as a GitHub release (anonymous download)
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = (Get-Content sha.txt) -replace 'sha=', ''
          gh release delete windows-standalone --yes --cleanup-tag || $true
          gh release create windows-standalone `
            --title "COVTL Console — standalone Windows x64 (${{ inputs.version || '3.1.5' }})" `
            --notes "Automated build (PyInstaller onedir, Python 3.12, smoke on a copy with synthesis + polar MP4). ASCII %TEMP% staging for non-ASCII install paths; Linux twin: release linux-standalone. sha256: $sha" `
            --latest `
            COVTL-Console-Windows-x64.zip#COVTL-Console-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: COVTL-Console-Windows-x64
          path: COVTL-Console-Windows-x64.zip
          retention-days: 30
          if-no-files-found: ignore
