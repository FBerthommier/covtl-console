# Workflow GitHub Actions — rebuild du standalone Linux x64.
#
# Exécute la chaîne packaging/linux (venv 2 phases, patch C1, build
# onedir, smoke avec contrôle MP4 — matplotlib porté —, porte d'hygiène
# B2) sur un runner ubuntu-latest, et publie le ZIP en artifact.
#
# Déclenchement : manuel (workflow_dispatch) ou push touchant la chaîne.

name: build-linux-x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packaging/linux/**'
      - '.github/workflows/build-linux.yml'

permissions:
  contents: write

jobs:
  linux:
    name: Standalone Linux x64 (PyInstaller onedir)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build + smoke (chaîne packaging/linux)
        working-directory: packaging/linux
        env:
          RUN_SMOKE: '1'
        shell: bash
        run: |
          set -o pipefail
          bash rebuild.sh 2>&1 | tee rebuild-run.log

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: packaging/linux/rebuild-run.log
          retention-days: 14
          if-no-files-found: error

      - name: Publish error tail (annotations)
        if: failure()
        working-directory: packaging/linux
        shell: bash
        run: |
          tail -n 45 rebuild-run.log | sed 's/%/%25/g' > /tmp/tail.txt
          split -l 5 -d /tmp/tail.txt /tmp/chunk_
          n=0
          for f in /tmp/chunk_*; do
            n=$((n+1))
            msg=$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")
            echo "::error title=rebuild-log part $n::$msg"
          done

      - name: Publish result sha256 (annotations)
        if: success()
        working-directory: packaging/linux
        shell: bash
        run: |
          sha=$(sha256sum releases/COVTL-Console-Linux-x64.zip | cut -d' ' -f1)
          size=$(stat -c%s releases/COVTL-Console-Linux-x64.zip)
          echo "::notice title=Linux ZIP::sha256=$sha size=$size octets"

      - name: Empreintes et tailles
        working-directory: packaging/linux
        run: |
          ls -l releases/
          sha256sum releases/COVTL-Console-Linux-x64.zip
          du -sm dist/linux/covtl-console

      - uses: actions/upload-artifact@v4
        with:
          name: COVTL-Console-Linux-x64
          path: |
            packaging/linux/releases/COVTL-Console-Linux-x64.zip
            packaging/linux/validation/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publier le ZIP en release GitHub (telechargeable anonymement)
        if: success()
        working-directory: packaging/linux
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(sha256sum releases/COVTL-Console-Linux-x64.zip | cut -d' ' -f1)
          gh release delete linux-standalone --yes --cleanup-tag || true
          gh release create linux-standalone \
            --title "COVTL Console — standalone Linux x64 (3.1.5)" \
            --notes "Build automatique (PyInstaller onedir, Python 3.12, smoke avec synthese + video MP4). sha256: $sha" \
            --latest \
            releases/COVTL-Console-Linux-x64.zip#COVTL-Console-Linux-x64.zip
